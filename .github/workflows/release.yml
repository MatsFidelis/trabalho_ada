name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      pipeline_mode:
        description: "live publica no GHCR; mock apenas gera evidências"
        required: true
        default: mock
        type: choice
        options: [mock, live]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      MODE: ${{ github.event_name == 'push' && 'live' || inputs.pipeline_mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
      - run: opa test policies -v
      - name: Build local image
        run: docker build -t trabalho-ada:${{ github.sha }} .
      - name: Login and publish image
        if: env.MODE == 'live'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        if: env.MODE == 'live'
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE }}
      - name: Generate SBOMs and vulnerability scan
        if: env.MODE == 'live'
        run: |
          mkdir -p artifacts
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/artifacts:/output" anchore/syft:latest "${IMAGE}" -o cyclonedx-json=/output/sbom.cdx.json -o spdx-json=/output/sbom.spdx.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/artifacts:/output" aquasec/trivy:latest image --format json --output /output/trivy.json "${IMAGE}"
      - name: Validate and analyze CycloneDX SBOM
        if: env.MODE == 'live'
        run: |
          docker run --rm -v "$PWD/artifacts:/work" cyclonedx/cyclonedx-cli:0.32.0 validate --input-file /work/sbom.cdx.json --input-format json --fail-on-errors > artifacts/cyclonedx-validate.txt
          docker run --rm -v "$PWD/artifacts:/work" cyclonedx/cyclonedx-cli:0.32.0 analyze --input-file /work/sbom.cdx.json --input-format json --output-format text > artifacts/cyclonedx-analyze.txt
      - name: Generate mock evidence
        if: env.MODE != 'live'
        env:
          IMAGE_REF: ${{ env.IMAGE }}
        run: bash scripts/mock_release_artifacts.sh
      - name: Enforce license policy and submit SBOM
        run: |
          python3 scripts/check_license_policy.py --sbom artifacts/sbom.cdx.json --output artifacts/license-policy.json
          python3 scripts/consulta_dt.py --sbom artifacts/sbom.cdx.json --project trabalho-ada --version "${{ github.ref_name }}" --output artifacts/dependency-track-log.json ${{ env.MODE != 'live' && '--mock' || '' }}
      - uses: sigstore/cosign-installer@v3
        if: env.MODE == 'live'
      - name: Sign and attest image
        if: env.MODE == 'live'
        run: |
          cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
          cosign attest --yes --predicate artifacts/sbom.cdx.json --type cyclonedx "${IMAGE}@${{ steps.build.outputs.digest }}"
          cosign attest --yes --predicate artifacts/trivy.json --type vuln "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Generate and attest SLSA provenance
        if: env.MODE == 'live'
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          cat > artifacts/provenance-predicate.json <<EOF
          {"buildDefinition":{"buildType":"https://github.com/Attestations/GitHubActionsWorkflow@v1","externalParameters":{"repository":"${{ github.repository }}","ref":"${{ github.ref }}","workflow":".github/workflows/release.yml"}},"runDetails":{"builder":{"id":"https://github.com/actions/attest-build-provenance"}}}
          EOF
          cat > artifacts/provenance.json <<EOF
          {"_type":"https://in-toto.io/Statement/v1","subject":[{"name":"${IMAGE}","digest":{"sha256":"${DIGEST#sha256:}"}}],"predicateType":"https://slsa.dev/provenance/v1","predicate":$(cat artifacts/provenance-predicate.json)}
          EOF
          cosign attest --yes --predicate artifacts/provenance-predicate.json --type slsaprovenance1 "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Generate GitHub build provenance
        if: env.MODE == 'live'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify signature and provenance
        if: env.MODE == 'live'
        run: |
          cosign verify "${IMAGE}@${{ steps.build.outputs.digest }}" --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.*" --certificate-oidc-issuer https://token.actions.githubusercontent.com > artifacts/cosign-verify.txt
          cosign verify-attestation "${IMAGE}@${{ steps.build.outputs.digest }}" --type slsaprovenance1 --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.*" --certificate-oidc-issuer https://token.actions.githubusercontent.com > artifacts/cosign-verify-attestation.txt
      - name: Persist release summary
        run: |
          cat > artifacts/release-summary.txt <<EOF
          pipeline_mode=${MODE}
          image_ref=${IMAGE}
          image_digest=${{ steps.build.outputs.digest || 'mock' }}
          release_ref=${{ github.ref }}
          EOF
      - name: Generate evidence integrity manifest
        run: python3 scripts/generate_evidence_manifest.py --directory artifacts
      - name: Verify evidence bundle
        run: python3 scripts/verify_evidence.py --directory artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: artifacts/

  publish-release:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/sbom.cdx.json
            artifacts/sbom.spdx.json
            artifacts/trivy.json
            artifacts/provenance.json
            artifacts/provenance-predicate.json
            artifacts/cosign-verify.txt
            artifacts/cosign-verify-attestation.txt
            artifacts/cyclonedx-validate.txt
            artifacts/cyclonedx-analyze.txt
            artifacts/license-policy.json
            artifacts/dependency-track-log.json
            artifacts/release-summary.txt
            artifacts/evidence-manifest.json
