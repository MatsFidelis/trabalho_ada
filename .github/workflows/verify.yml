name: verify

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release a ser revalidada"
        required: false
        type: string

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required structure
        run: |
          for file in Dockerfile README.md package.json k8s/deployment.yaml k8s/policy-controller-policy.yaml dashboards/grafana-dashboard.json evidencias/README.md evidencias/gate-bloqueio-exemplo.txt scripts/mock_release_artifacts.sh scripts/check_license_policy.py scripts/consulta_dt.py scripts/gera_relatorio.sh scripts/gera_dashboard.py scripts/generate_evidence_manifest.py scripts/verify_evidence.py; do test -f "$file"; done
          test "$(find policies/rego -name '*.rego' | wc -l)" -ge 5
      - name: Validate YAML and JSON
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml", "k8s/*.yaml"].each { |f| YAML.load_stream(File.read(f)); puts "ok #{f}" }'
          python3 -m json.tool package.json > /dev/null
          python3 -m json.tool dashboards/grafana-dashboard.json > /dev/null
  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
      - run: opa test policies -v
  evidence-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build artifact image
        run: docker build -t trabalho-ada:verify .
      - name: Generate and validate mock evidence
        run: |
          bash scripts/mock_release_artifacts.sh
          python3 scripts/check_license_policy.py --sbom artifacts/sbom.cdx.json --output artifacts/license-policy.json
          python3 scripts/consulta_dt.py --sbom artifacts/sbom.cdx.json --project trabalho-ada --version verify --output artifacts/dependency-track-log.json --mock
          python3 scripts/generate_evidence_manifest.py --directory artifacts
          python3 scripts/verify_evidence.py --directory artifacts
          MOCK_MODE=1 bash scripts/gera_relatorio.sh
          python3 scripts/gera_dashboard.py --csv "relatorios/$(date +%Y-%m)/conformidade.csv" --dt-log artifacts/dependency-track-log.json --trivy-log artifacts/trivy.json --output verification/dashboard.html
      - uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: |
            artifacts/
            relatorios/
            verification/

  verify-release-evidence:
    if: github.event_name == 'release' || github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Download published evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded-release
          gh release download "${{ steps.tag.outputs.value }}" --dir downloaded-release --repo "${{ github.repository }}"
      - name: Validate evidence package
        run: python3 scripts/verify_evidence.py --directory downloaded-release
      - name: Resolve image digest and revalidate attestations
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.value }}"
          docker pull "$IMAGE" >/dev/null
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)"
          mkdir -p verification
          cosign verify "$IMAGE@$DIGEST" --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/.*" --certificate-oidc-issuer https://token.actions.githubusercontent.com > verification/cosign-verify.txt
          cosign verify-attestation "$IMAGE@$DIGEST" --type slsaprovenance1 --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/.*" --certificate-oidc-issuer https://token.actions.githubusercontent.com > verification/cosign-verify-attestation.txt
      - name: Generate audit report and KPI dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          bash scripts/gera_relatorio.sh
          python3 scripts/gera_dashboard.py --csv "relatorios/$(date +%Y-%m)/conformidade.csv" --dt-log downloaded-release/dependency-track-log.json --trivy-log downloaded-release/trivy.json --output verification/dashboard.html
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ steps.tag.outputs.value }}
          path: |
            downloaded-release/
            verification/
            relatorios/
